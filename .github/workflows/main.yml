name: Build
on: [ push, pull_request ]

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          cache-version: 1
      - name: Run rubocop
        run: |
          bundle exec rubocop --parallel

  tests:
    name: Active Record / ${{ matrix.lane }} / Ruby ${{ matrix.ruby-version }} / Rails ${{ matrix.rails-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: pinned
            ruby-version: "4.0.2"
            rails-version: "8.0.5.1"
          - lane: latest
            ruby-version: "4.0.7"
            rails-version: "8.1.3.1"
    env:
      TARGET_DB: sqlite
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/sql.gemfile
      RAILS_VERSION: ${{ matrix.rails-version }}
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: 1
      - name: Setup test database
        run: |
          bin/rails db:setup
      - name: Run tests
        run: bin/rails test
      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.lane }}-attempt${{ github.run_attempt }}
          path: |
            test/dummy/log/test.log
          if-no-files-found: ignore
          retention-days: 30

  mongodb-tests:
    name: MongoDB / ${{ matrix.lane }} / Ruby ${{ matrix.ruby-version }} / Rails ${{ matrix.rails-version }} / mongo ${{ matrix.mongo-driver-version }} / Mongoid ${{ matrix.mongoid-version }} / MongoDB ${{ matrix.mongodb-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: pinned
            ruby-version: "4.0.2"
            rails-version: "8.0.5.1"
            mongo-driver-version: "2.26.0"
            mongoid-version: "7.6.1"
            mongoid-git: https://github.com/tablecheck/mongoid-ultra.git
            mongoid-ref: fad21072de6cb539a8addec278a6beb4bf1a5321
            mongodb-version: "8.0"
          - lane: latest
            ruby-version: "4.0.7"
            rails-version: "8.1.3.1"
            mongo-driver-version: "2.26.0"
            mongoid-version: "9.1.1"
            mongodb-version: "8.3"
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/mongodb.gemfile
      MONGODB_URI: mongodb://127.0.0.1:27017/solid_queue_test?replicaSet=rs0&appName=solid-queue-fault-tests
      MONGODB_FAULT_TESTS: "1"
      MONGODB_STANDALONE_URI: mongodb://127.0.0.1:27018/solid_queue_standalone_test?directConnection=true
      RAILS_VERSION: ${{ matrix.rails-version }}
      MONGO_DRIVER_VERSION: ${{ matrix.mongo-driver-version }}
      MONGOID_VERSION: ${{ matrix.mongoid-version }}
      MONGOID_GIT: ${{ matrix.mongoid-git }}
      MONGOID_REF: ${{ matrix.mongoid-ref }}
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name solid-queue-mongodb --publish 127.0.0.1:27017:27017 mongo:${{ matrix.mongodb-version }} mongod --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          docker run --detach --name solid-queue-mongodb-standalone --publish 127.0.0.1:27018:27017 mongo:${{ matrix.mongodb-version }} mongod --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec solid-queue-mongodb mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs solid-queue-mongodb
              exit 1
            fi
            sleep 1
          done
          docker exec solid-queue-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 60); do
            if docker exec solid-queue-mongodb mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs solid-queue-mongodb
              exit 1
            fi
            sleep 1
          done
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: 1
      - name: Run MongoDB tests
        run: bundle exec ruby -Itest -e 'Dir["test/mongodb/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - name: Run Mongoid integration tests
        run: |
          bundle exec ruby -Itest -e 'Dir["test/mongoid/**/*_test.rb"].sort_by { |file| [ File.basename(file) == "arguments_test.rb" ? 1 : 0, file ] }.each { |file| require File.expand_path(file) }'
      - name: Upload MongoDB logs on failure
        if: ${{ failure() }}
        run: |
          if docker inspect solid-queue-mongodb >/dev/null 2>&1; then
            docker logs solid-queue-mongodb
          fi
