volumes:
  db: {}
  mongodb: {}

services:
  mysql:
    image: mysql:8.0.31
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    ports: [ "127.0.0.1:33066:3306" ]
  postgres:
    image: postgres:15.1
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - db:/var/lib/postgres
    ports: [ "127.0.0.1:55432:5432" ]
  mongodb:
    image: mongo:8.0
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all", "--setParameter", "enableTestCommands=1" ]
    volumes:
      - mongodb:/data/db
    ports: [ "127.0.0.1:27017:27017" ]
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval 'try { if (db.hello().isWritablePrimary) quit(0); rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); quit(1) } catch (error) { quit(1) }'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
